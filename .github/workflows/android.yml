name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build release APK
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          gradle assembleRelease --no-daemon --stacktrace \
            -PversionCode=${{ github.run_number }} -PversionName=$VERSION

      - name: Sign APK
        env:
          KS_B64: ${{ secrets.BANCA_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.BANCA_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Secrets BANCA_KEYSTORE_BASE64 / BANCA_KEYSTORE_PASSWORD are missing."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -p -f 4 "$IN" aligned.apk
          $BT/apksigner sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias banca \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS --out banca.apk aligned.apk
          $BT/apksigner verify --print-certs banca.apk
          rm -f "$RUNNER_TEMP/release.jks"
          cp banca.apk "banca-$VERSION-build${{ github.run_number }}.apk"

      - name: Render screenshots (for design review)
        continue-on-error: true
        run: |
          gradle :app:recordRoborazziDebug --no-daemon --stacktrace -PversionCode=${{ github.run_number }} -PversionName=$VERSION > screens.log 2>&1 || (tail -80 screens.log; exit 1)
          tail -5 screens.log
          ls -la app/build/screens || true
          cd app/build/screens && zip -q ../../../screens.zip *.png

      - uses: actions/upload-artifact@v4
        with:
          name: banca-apk
          path: banca-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: Banca ${{ env.VERSION }} (build ${{ github.run_number }})
          make_latest: true
          body: |
            Download `banca.apk` below and open it on your Android phone to install.
            Updates install over the previous version and keep your data.
          files: |
            banca.apk
            banca-*.apk
            screens.zip
            screens.log
